[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "MIT"
authors = ["Javier Altez"]
repository = "https://github.com/jaltez/voyager"
description = "Configurable deep research CLI with pluggable search providers and LLM backends"

[workspace.dependencies]
vygr-core = { path = "crates/core", version = "0.4.1" }
vygr-providers = { path = "crates/providers", version = "0.4.1" }
vygr-llm = { path = "crates/llm", version = "0.4.1" }
vygr-research = { path = "crates/research", version = "0.4.1" }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "net", "io-std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scraper = "0.23"
percent-encoding = "2"
sha2 = "0.10"
tempfile = "3"
async-trait = "0.1"
futures = "0.3"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = "thin"
strip = true
