name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }} --bin vygr
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf "vygr-${{ matrix.target }}.tar.gz" vygr
          sha256sum "vygr-${{ matrix.target }}.tar.gz" > "vygr-${{ matrix.target }}.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/vygr-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/vygr-${{ matrix.target }}.tar.gz.sha256
